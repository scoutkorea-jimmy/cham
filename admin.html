<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 · 한국참전통발효식품협동조합</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style id="admin-style">
  body { background: var(--surface-2); }
  .admin { display: flex; min-height: 100vh; }
  .admin-side { width: 250px; flex-shrink: 0; background: var(--main-deeper); color: #fff; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .admin-side .as-brand { display: flex; align-items: center; gap: 11px; padding: 22px 22px 18px; border-bottom: 1px solid rgba(255,255,255,.12); }
  .admin-side .as-brand img { width: 38px; height: 38px; background: var(--bg); border-radius: 9px; padding: 4px; }
  .admin-side .as-brand b { font-family: var(--font-head); font-weight: 800; font-size: 15px; line-height: 1.2; }
  .admin-side .as-brand span { font-size: 10.5px; color: var(--sub); letter-spacing: .08em; }
  .admin-nav { padding: 14px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; overflow-y: auto; }
  .admin-nav button { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 11px 14px; border: none; background: transparent; color: rgba(255,255,255,.75); font: inherit; font-size: 14px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: all var(--dur-fast) var(--ease); }
  .admin-nav button:hover { background: rgba(255,255,255,.08); color: #fff; }
  .admin-nav button.on { background: var(--point); color: #fff; }
  .admin-nav button i[data-lucide] { width: 18px; height: 18px; }
  .admin-nav .badge { margin-left: auto; background: rgba(255,255,255,.18); border-radius: 999px; font-size: 11px; font-weight: 700; padding: 1px 8px; }
  .admin-nav button.on .badge { background: rgba(255,255,255,.25); }
  /* ── 사이드바 그룹 ──
     평평한 목록 15개는 눈으로 훑기 어렵다. 하는 일이 같은 것끼리 묶는다. */
  .admin-nav .nav-solo { font-weight: 700; }
  .admin-nav .nav-solo + .nav-group { margin-top: 6px; }
  /* 사용 설명서 — 막혔을 때 가장 먼저 찾는 곳이라 한눈에 띄어야 한다 */
  .admin-nav .nav-manual { background: rgba(255,188,0,.14); border: 1.5px solid rgba(255,188,0,.55);
    color: #fff; font-size: 15.5px; font-weight: 800; padding: 13px 14px; margin-bottom: 8px; }
  .admin-nav .nav-manual i[data-lucide] { width: 20px; height: 20px; color: var(--point); }
  .admin-nav .nav-manual:hover { background: rgba(255,188,0,.24); border-color: var(--point); }
  .admin-nav .nav-manual.on { background: var(--point); border-color: var(--point); color: var(--point-ink); }
  .admin-nav .nav-manual.on i[data-lucide] { color: var(--point-ink); }

  /* 2) 설명서 목차 — 상단 탭.
     top:0 으로 두면 같은 자리에 붙어 있는 관리자 상단바(sticky · 70px · z-index 10)
     **아래로 들어가 사라진다**. 상단바 높이만큼 내려 붙여야 늘 보인다. */
  .man-tabs { position: sticky; top: var(--admin-top-h); z-index: 6; background: var(--surface-2);
    border-bottom: 2px solid var(--line-soft); margin: -8px 0 24px; padding: 10px 0 0; }
  .man-tabs .mt-row { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .man-tabs .mt-row::-webkit-scrollbar { display: none; }
  .man-tabs a { white-space: nowrap; padding: 11px 16px; font-size: 14.5px; font-weight: 700;
    color: var(--ink-mute); border-bottom: 3px solid transparent; margin-bottom: -2px; border-radius: 8px 8px 0 0; }
  .man-tabs a:hover { color: var(--ink); background: var(--surface); }
  .man-tabs a.on { color: var(--point-deep); border-bottom-color: var(--point); background: var(--surface); }

  /* 3) 도움말 챗봇 — 우측 하단 */
  /* site.js 의 '맨 위로'(.to-top)가 같은 자리(오른쪽 아래)에 z-index 900 으로 뜬다.
     그대로 두면 챗봇 버튼을 덮어 눌리지 않는다 — 위로 올려 겹치지 않게 쌓는다. */
  .admin .to-top, body > .to-top { bottom: 94px !important; right: 26px !important; }
  .cb-fab { position: fixed; right: 22px; bottom: 22px; z-index: 950; width: 60px; height: 60px;
    border-radius: 50%; border: none; cursor: pointer; background: var(--point); color: var(--point-ink);
    box-shadow: var(--sh-lg); display: grid; place-items: center; transition: transform var(--dur-fast) var(--ease); }
  .cb-fab:hover { transform: translateY(-2px) scale(1.04); }
  .cb-fab i[data-lucide] { width: 26px; height: 26px; }
  .cb-fab.hide { display: none; }
  .cb-panel { position: fixed; right: 22px; bottom: 22px; z-index: 951; width: min(440px, calc(100vw - 32px));
    height: min(680px, calc(100vh - 44px)); background: var(--surface); border-radius: var(--r-xl);
    box-shadow: var(--sh-lg); display: none; flex-direction: column; overflow: hidden; border: 1px solid var(--line-soft); }
  .cb-panel.open { display: flex; }
  .cb-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px;
    background: var(--main-deeper); color: #fff; }
  .cb-head b { font-size: 15.5px; }
  .cb-head .cb-sub { font-size: 12px; color: rgba(255,255,255,.7); display: block; margin-top: 2px; }
  .cb-head button { margin-left: auto; background: transparent; border: none; color: rgba(255,255,255,.8);
    cursor: pointer; display: grid; place-items: center; padding: 4px; border-radius: 8px; }
  .cb-head button:hover { background: rgba(255,255,255,.14); color: #fff; }
  .cb-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    background: var(--surface-2); }
  .cb-msg { max-width: 88%; padding: 11px 14px; border-radius: 14px; font-size: 14.5px; line-height: 1.7; }
  .cb-msg.me { align-self: flex-end; background: var(--point); color: var(--point-ink); border-bottom-right-radius: 5px;
    font-weight: 600; white-space: pre-wrap; }
  /* 답에 설명서 본문이 딸려 오므로 말풍선을 좁게 두면 표·단계가 다 접힌다 */
  .cb-msg.bot { align-self: stretch; max-width: 100%; background: var(--surface);
    border: 1px solid var(--line-soft); border-bottom-left-radius: 5px; }
  .cb-msg.bot b { color: var(--ink); }
  .cb-ans p { margin: 0; }
  .cb-ans p + p { margin-top: 7px; }
  .cb-ans .cb-wait { color: var(--ink-faint); font-size: 13px; margin-left: 4px; }
  .cb-steps { margin: 7px 0 0; padding: 0; list-style: none; counter-reset: cbs; display: grid; gap: 7px; }
  .cb-steps li { counter-increment: cbs; display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
  .cb-steps li::before { content: counter(cbs); grid-column: 1; grid-row: 1; width: 22px; height: 22px;
    border-radius: 50%; background: var(--main); color: #fff; font-size: 12px; font-weight: 800;
    display: grid; place-items: center; margin-top: 2px; }
  .cb-steps li > * { grid-column: 2; }

  /* 찾은 설명서 절을 그대로 펼쳐 놓는 칸 */
  .cb-doc-wrap { margin-top: 12px; border-top: 1px solid var(--line-soft); padding-top: 11px; }
  .cb-doc-h { display: flex; align-items: center; gap: 7px; font-size: 13.5px; }
  .cb-doc-h i[data-lucide] { width: 15px; height: 15px; color: var(--main); }
  .cb-doc-h b { font-size: 14px; }
  .cb-doc-h span { margin-left: auto; font-size: 11.5px; color: var(--ink-faint); }
  .cb-doc { position: relative; max-height: 260px; overflow: hidden; margin-top: 9px; cursor: zoom-in;
    border: 1px solid var(--line-soft); border-radius: var(--r-md); padding: 12px 14px; background: var(--surface-2);
    -webkit-mask-image: linear-gradient(180deg, #000 200px, transparent);
    mask-image: linear-gradient(180deg, #000 200px, transparent); }
  .cb-acts { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
  .cb-acts button { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 13px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; }
  .cb-acts button i[data-lucide] { width: 15px; height: 15px; }
  .cb-acts button:hover { border-color: var(--main); color: var(--main-deep); }
  .cb-acts .cb-main { background: var(--main); border-color: var(--main); color: #fff; }
  .cb-acts .cb-main:hover { background: var(--main-deep); color: #fff; }
  .cb-src { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
  .cb-src > span { font-size: 12px; color: var(--ink-faint); }
  .cb-src button { font: inherit; font-size: 12.5px; font-weight: 700; padding: 5px 11px; border-radius: 99px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--main-deep); cursor: pointer; }
  .cb-src button:hover { border-color: var(--main); background: var(--main-tint); }
  .cb-link { font: inherit; font-size: inherit; padding: 0; border: none; background: none; cursor: pointer;
    color: var(--main-deep); text-decoration: underline; }

  /* 설명서 본문을 관리자 화면 밖(챗봇·크게 보기)에 끼워 넣을 때의 보정.
     .admin-view .man-body 규칙이 닿지 않는 자리라 같은 것을 여기서 다시 준다. */
  .man-embed .section { padding-block: 0 !important; background: none !important; border-radius: 0; }
  .man-embed .wrap { max-width: none; padding-inline: 0; }
  .man-embed .reveal { opacity: 1 !important; transform: none !important; animation: none !important; }
  .man-embed .page-hero, .man-embed .jump { display: none; }
  .man-embed img { max-width: 100%; height: auto; cursor: zoom-in; border-radius: var(--r-md); }
  .cb-doc.man-embed { font-size: 14.5px; line-height: 1.75; }
  .cb-doc.man-embed h2 { font-size: 17px; }
  .cb-doc.man-embed h3 { font-size: 15px; }
  .cb-doc.man-embed .table { font-size: 13px; }

  /* 크게 보기 — 전체 화면 + 글자 배율 */
  .cb-zoom { position: fixed; inset: 0; z-index: 970; background: rgba(23,26,22,.62);
    display: none; padding: 24px; overflow: auto; }
  .cb-zoom.open { display: block; }
  .cb-zoom-card { background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--sh-lg);
    width: min(940px, 100%); margin: 0 auto; display: flex; flex-direction: column;
    max-height: calc(100vh - 48px); overflow: hidden; }
  .cb-zoom-bar { display: flex; align-items: center; gap: 10px; padding: 14px 18px;
    background: var(--main-deeper); color: #fff; flex: none; }
  .cb-zoom-bar > b { font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cb-zoom-tools { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }
  .cb-zoom-tools button { font: inherit; font-size: 13px; font-weight: 700; background: rgba(255,255,255,.12);
    border: none; color: #fff; cursor: pointer; border-radius: 9px; padding: 7px 10px;
    display: inline-flex; align-items: center; gap: 5px; }
  .cb-zoom-tools button:hover { background: rgba(255,255,255,.24); }
  .cb-zoom-tools button:disabled { opacity: .35; cursor: default; }
  .cb-zoom-tools button i[data-lucide] { width: 16px; height: 16px; }
  .cb-zoom-tools #cbZoomPct { font-size: 13px; font-weight: 700; min-width: 46px; text-align: center;
    color: rgba(255,255,255,.9); }
  .cb-zoom-body { overflow: auto; padding: 22px 26px 30px; }
  .cb-locked { overflow: hidden; }

  /* 사진 원본 보기 */
  .cb-img { position: fixed; inset: 0; z-index: 980; background: rgba(23,26,22,.86);
    display: none; place-items: center; padding: 24px; cursor: zoom-out; }
  .cb-img.open { display: grid; }
  .cb-img img { max-width: 100%; max-height: calc(100vh - 48px); border-radius: var(--r-md); box-shadow: var(--sh-lg); }
  .cb-img p { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.75); font-size: 13px; }
  .cb-quick { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; background: var(--surface-2); }
  .cb-quick.hide { display: none; }
  .cb-quick button { font: inherit; font-size: 12.5px; padding: 7px 12px; border-radius: 99px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); cursor: pointer; }
  .cb-quick button:hover { border-color: var(--main); color: var(--main-deep); }
  .cb-foot { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line-soft); background: var(--surface); }
  .cb-foot input { flex: 1; min-height: 44px; padding: 10px 14px; font: inherit; font-size: 15px;
    border: 1.5px solid var(--line); border-radius: 12px; }
  .cb-foot input:focus { outline: none; border-color: var(--main); }
  .cb-foot button { min-width: 46px; border-radius: 12px; border: none; background: var(--main); color: #fff; cursor: pointer; }
  .cb-foot button:disabled { opacity: .5; cursor: default; }
  .cb-dots span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%;
    background: var(--ink-faint); animation: cbBlink 1.2s infinite; }
  .cb-dots span:nth-child(2){ animation-delay:.2s } .cb-dots span:nth-child(3){ animation-delay:.4s }
  @keyframes cbBlink { 0%,60%,100%{opacity:.25} 30%{opacity:1} }
  @media (max-width: 760px){
    .cb-fab { right: 14px; bottom: 14px; }
    .cb-panel { right: 8px; bottom: 8px; }
    .cb-zoom { padding: 0; }
    .cb-zoom-card { max-height: 100vh; border-radius: 0; }
    .cb-zoom-body { padding: 16px 14px 26px; }
    .cb-zoom-bar { padding: 12px 14px; }
    .cb-zoom-bar > b { font-size: 14.5px; }
    .cb-zoom-tools #cbZoomGo { display: none; }   /* 좁은 화면에선 배율·닫기만 */
  }
  .nav-group { padding-top: 8px; margin-top: 4px; }
  .nav-group:first-child { border-top: none; }
  /* 상위 메뉴는 하위 항목과 무게가 달라야 한다 — 아이콘을 상자에 담고 글자를 키운다 */
  .nav-gh { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    padding: 12px 12px; border: none; background: transparent; color: #fff;
    font: inherit; font-size: 15.5px; font-weight: 800; letter-spacing: -0.01em;
    border-radius: 11px; cursor: pointer; transition: all var(--dur-fast) var(--ease); }
  .nav-gh > i[data-lucide]:first-child { width: 20px; height: 20px; flex-shrink: 0;
    box-sizing: content-box; padding: 6px; border-radius: 9px;
    background: rgba(255,255,255,.12); color: var(--point); }
  .nav-gh:hover { background: rgba(255,255,255,.08); }
  .nav-gh:hover > i[data-lucide]:first-child { background: rgba(255,255,255,.20); }
  .nav-gh.on { background: var(--point); color: var(--point-ink); }
  .nav-gh.on > i[data-lucide]:first-child { background: rgba(0,0,0,.12); color: var(--point-ink); }
  .nav-gh.on .nav-caret { opacity: .8; }
  .nav-gh > span { flex: 1; min-width: 0; }
  .nav-gh i[data-lucide] { width: 18px; height: 18px; }
  .nav-caret { transition: transform var(--dur-fast) var(--ease); opacity: .6; width: 15px !important; height: 15px !important; }
  .nav-group.open .nav-caret { transform: rotate(180deg); }
  /* 접힘은 높이가 아니라 표시 여부로 — 항목 수가 달라도 애니메이션이 어긋나지 않는다 */
  .nav-sub { display: none; padding: 4px 0 8px 16px; margin-left: 18px; border-left: 1px solid rgba(255,255,255,.12); }
  .nav-group.open .nav-sub { display: block; }
  .nav-sub button { font-size: 14.5px; font-weight: 600; padding-left: 14px; }
  .nav-sub button i[data-lucide] { width: 16px; height: 16px; opacity: .8; }
  .nav-sub button::before { content: ""; position: absolute; left: 6px; width: 3px; height: 16px;
    border-radius: 2px; background: transparent; }
  .nav-sub button { position: relative; }
  .nav-sub button.on::before { background: var(--point); }
  .nav-sub button.on { background: rgba(255,255,255,.12); color: #fff; }

  /* 그룹 요약 화면 */
  .gs-head { margin-bottom: 22px; }
  .gs-head h2 { font-size: 24px; }
  .gs-head p { color: var(--ink-mute); font-size: 15px; margin-top: 6px; }
  .gs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 24px; }
  .gs-card { display: flex; align-items: center; gap: 14px; text-align: left; font: inherit; cursor: pointer;
    background: var(--surface); border: 1.5px solid var(--line-soft); border-radius: 14px; padding: 18px 20px;
    box-shadow: var(--sh-xs); transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
  .gs-card:hover { transform: translateY(-2px); box-shadow: var(--sh-md); border-color: var(--main); }
  .gs-card:focus-visible { outline: 3px solid var(--point); outline-offset: 2px; }
  .gs-i { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    background: var(--main-tint); color: var(--main); flex-shrink: 0; }
  .gs-i i[data-lucide] { width: 22px; height: 22px; }
  .gs-b { flex: 1; min-width: 0; }
  .gs-b b { display: block; font-size: 16px; }
  .gs-b span { display: block; font-size: 13.5px; color: var(--ink-mute); margin-top: 3px; }
  .gs-n { font-size: 13px; font-weight: 700; color: var(--point-deep); white-space: nowrap; }
  .gs-go { width: 18px !important; height: 18px !important; color: var(--ink-faint); flex-shrink: 0; }
  .gs-head + .stat-grid .stat { padding: 18px 20px; }
  .gs-head + .stat-grid .sv { font-size: 26px; }

  .as-foot { padding: 14px; border-top: 1px solid rgba(255,255,255,.12); display: flex; flex-direction: column; gap: 8px; }
  .as-foot a, .as-foot button { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.7); background: transparent; border: none; cursor: pointer; font-family: inherit; }
  .as-foot a:hover, .as-foot button:hover { background: rgba(255,255,255,.08); color: #fff; }
  .as-foot i[data-lucide]{ width: 16px; height: 16px; }

  .admin-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* 상단바 높이는 아래에 붙는 것들(설명서 탭 · 절 앵커)이 기준으로 삼는다 — 한 곳에서 정한다 */
  .admin { --admin-top-h: 70px; }
  .admin-top { background: rgba(252,250,243,.86); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line-soft); padding: 0 32px; height: var(--admin-top-h); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .admin-top h1 { font-size: 22px; }
  .admin-top .at-meta { font-size: 13px; color: var(--ink-mute); }
  /* 상단 우측 — 로그인한 사람 + 매뉴얼 버튼. 막혔을 때 바로 눈에 들어와야 한다 */
  .admin-top .at-right { display: flex; align-items: center; gap: 16px; }
  .at-manual { border: none; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px;
    border-radius: var(--r-pill); background: var(--point); color: var(--point-ink);
    font-size: 15px; font-weight: 700; white-space: nowrap; box-shadow: var(--sh-xs); }
  .at-manual:hover { box-shadow: var(--sh-sm); transform: translateY(-1px); }
  .at-manual i[data-lucide] { width: 18px; height: 18px; }
  @media (max-width: 760px){ .admin-top .at-meta { display: none; } }
  /* 아래 여백이 큰 이유 — 오른쪽 아래에 고정 버튼 둘(챗봇 · 맨 위로)이 떠 있다.
     여백이 없으면 화면 맨 아래 버튼(쪽 이동 '다음', '기수 추가', '기본값 복원')을
     덮어 눌리지 않는다. 실제로 3개 화면에서 겹쳤다. */
  .admin-view { padding: 32px 32px 160px; max-width: 1240px; }

  /* KMS · 동의문 보기 렌더 */
  .kms-view { padding: 4px 2px; color: var(--ink); }
  .kms-view .kms-title { font-size: 20px; font-family: var(--font-head); font-weight: 800; color: var(--main-deeper); margin: 4px 0 14px; padding-bottom: 12px; border-bottom: 2px solid var(--main-tint); }
  .kms-view .kms-sec { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; color: var(--ink); margin: 22px 0 10px; }
  .kms-view .kms-num { flex-shrink: 0; width: 24px; height: 24px; border-radius: 7px; background: var(--main); color: #fff; font-size: 13px; font-weight: 800; display: grid; place-items: center; }
  .kms-view .kms-ul { margin: 6px 0 6px; padding-left: 6px; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .kms-view .kms-ul li { position: relative; padding-left: 18px; font-size: 13.5px; line-height: 1.7; color: var(--ink-soft); }
  .kms-view .kms-ul li::before { content: ""; position: absolute; left: 3px; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--point); }
  .kms-view .kms-p { font-size: 13.5px; color: var(--ink-mute); margin: 6px 0; line-height: 1.7; }
  .kms-view .kms-swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -1px; margin-right: 3px; }

  /* 서브탭 (KMS · 동의문) */
  .subtabs { display: inline-flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 12px; padding: 5px; margin-bottom: 20px; }
  .subtabs button { display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px; border: none; background: none; font: inherit; font-size: 14px; font-weight: 700; color: var(--ink-mute); cursor: pointer; border-radius: 9px; transition: all var(--dur-fast) var(--ease); }
  .subtabs button:hover { color: var(--ink); }
  .subtabs button.on { background: var(--main); color: #fff; box-shadow: var(--sh-sm); }
  .subtabs button i[data-lucide] { width: 16px; height: 16px; }

  /* 주문 처리 안내 */
  .oguide { border: 1px solid var(--line-soft); border-radius: 12px; background: var(--main-tint); margin-bottom: 16px; overflow: hidden; }
  .oguide summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 13px 18px; font-weight: 700; font-size: 14px; color: var(--main-deep); }
  .oguide summary::-webkit-details-marker { display: none; }
  .oguide summary i[data-lucide] { width: 17px; height: 17px; }
  .oguide-body { padding: 4px 20px 18px; }
  .oflow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 10px 0 14px; }
  .oguide-body ul { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.95; color: var(--ink-soft); }
  .oguide-body b { color: var(--ink); }

  /* 주문 관리 — 상태 탭 */
  .otabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line-soft); flex-wrap: wrap; margin-top: 4px; }
  .otabs button { padding: 11px 14px; border: none; background: none; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-mute); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .otabs button:hover { color: var(--ink); }
  .otabs button.on { color: var(--point); border-color: var(--point); }
  .otabs .cnt { color: var(--point); font-weight: 800; margin-left: 5px; font-size: 13px; }

  /* 주문 처리 버튼 (그룹) */
  .obar { display: flex; gap: 18px; flex-wrap: wrap; padding: 16px 0 4px; }
  .ogrp { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; padding: 9px 12px; border: 1px solid var(--line-soft); border-radius: 12px; background: var(--surface-2); }
  .ogrp-l { font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--ink-mute); margin-right: 2px; }
  .obtn { padding: 9px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-family: inherit; color: var(--ink); white-space: nowrap; }
  .obtn:hover { border-color: var(--main); color: var(--main); }
  .obtn.primary { background: var(--info); color: #fff; border-color: var(--info); }
  .obtn.primary:hover { opacity: .92; color: #fff; }
  .odrop { position: relative; }
  .odrop-menu { position: absolute; top: calc(100% + 4px); left: 0; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--sh-md); padding: 6px; display: none; z-index: 40; min-width: 200px; }
  .odrop-menu.open { display: block; }
  .odrop-menu button { display: block; width: 100%; text-align: left; padding: 9px 12px; border: none; background: none; font: inherit; font-size: 13px; border-radius: 7px; cursor: pointer; }
  .odrop-menu button:hover { background: var(--surface-2); }
  .proc-info { border-left: 3px solid var(--info); background: var(--surface-2); padding: 10px 14px; font-size: 13.5px; border-radius: 0 8px 8px 0; margin-bottom: 14px; }

  /* 상품 이미지 미리보기 / 목록 썸네일 */
  .pthumb { width: 48px; height: 48px; border-radius: 8px; overflow: hidden; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-faint); }
  .pthumb img { width: 100%; height: 100%; object-fit: cover; }
  .pthumb i[data-lucide] { width: 18px; height: 18px; }
  .pimg-grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .pimg-cell { position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line-soft); background: var(--surface-2); }
  .pimg-cell.new { border-color: var(--main); box-shadow: 0 0 0 2px var(--main-tint); }
  .pimg-cell img { width: 100%; height: 100%; object-fit: cover; }
  .pimg-role { position: absolute; left: 4px; bottom: 4px; background: rgba(42,39,35,.66); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 99px; }
  .pimg-cell .gal-del { top: 4px; right: 4px; width: 20px; height: 20px; }

  /* 관련상품 멀티 드롭다운 */
  .ms { position: relative; max-width: 480px; }
  .ms-toggle { display: inline-flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; max-width: 320px; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); }
  .ms-toggle:hover { border-color: var(--main); }
  .ms-toggle i[data-lucide] { width: 16px; height: 16px; color: var(--ink-mute); }
  .ms-panel { position: absolute; z-index: 30; margin-top: 6px; width: min(360px, 92vw); background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--sh-md); padding: 10px; }
  .ms-search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 13px; margin-bottom: 8px; }
  .ms-list { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .ms-opt { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
  .ms-opt:hover { background: var(--surface-2); }
  .ms-opt input { width: 16px; height: 16px; accent-color: var(--main); }
  .ms-opt span:first-of-type { flex: 1; }
  .ms-cat { font-size: 11px; color: var(--ink-mute); background: var(--surface-2); padding: 2px 8px; border-radius: 99px; }
  .ms-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ms-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--main-tint); color: var(--main-deep); font-size: 12.5px; font-weight: 600; padding: 5px 6px 5px 12px; border-radius: 99px; }
  .ms-chip button { border: none; background: none; cursor: pointer; color: var(--main-deep); display: grid; place-items: center; padding: 2px; border-radius: 50%; }
  .ms-chip button:hover { background: rgba(0,0,0,.08); }
  .ms-chip i[data-lucide] { width: 13px; height: 13px; }

  /* 대시보드 방문 차트 */
  .stat .ss { font-size: 12px; color: var(--ink-faint); margin-top: 3px; }
  .vchart { display: flex; align-items: flex-end; gap: 14px; height: 150px; padding: 0 6px; }
  .vc-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; }
  .vc-bar { width: 100%; max-width: 46px; background: linear-gradient(to top, var(--main), var(--main-deep)); border-radius: 7px 7px 3px 3px; min-height: 4px; }
  .vc-val { font-size: 12px; font-weight: 700; color: var(--main-deep); }
  .vc-day { font-size: 11px; color: var(--ink-mute); }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  @media (max-width: 900px){ .stat-grid { grid-template-columns: repeat(2,1fr); } }
  .stat { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-lg); padding: 20px 22px; box-shadow: var(--sh-xs); }
  .stat .si { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--main-tint); color: var(--main); margin-bottom: 14px; }
  .stat .si i[data-lucide]{ width: 21px; height: 21px; }
  .stat .sv { font-family: var(--font-head); font-weight: 800; font-size: 30px; line-height: 1; }
  .stat .sl { font-size: 13px; color: var(--ink-mute); margin-top: 6px; }

  .panel { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sh-xs); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px var(--gutter-panel); border-bottom: 1px solid var(--line-soft); }
  .panel-head h3 { font-size: 17px; }
  .panel-head .ph-sub { font-size: 13px; color: var(--ink-mute); }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .admin-table th, .admin-table td { text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  /* 표는 패널 폭을 꽉 채우되(머리글 띠가 상자만큼 이어져야 표로 읽힌다)
     첫 칸·끝 칸의 글자는 패널 제목과 같은 선에서 시작한다. */
  .admin-table th:first-child, .admin-table td:first-child { padding-left: var(--gutter-panel); }
  .admin-table th:last-child,  .admin-table td:last-child  { padding-right: var(--gutter-panel); }
  .admin-table th { background: var(--surface-2); font-size: 12px; color: var(--ink-soft); font-weight: 700; letter-spacing: .02em; }
  .admin-table tr:last-child td { border-bottom: none; }
  .admin-table tbody tr:hover { background: var(--surface-2); }
  /* 끌어서 순서 바꾸기 — 손잡이가 보여야 끌 수 있다는 것을 안다 */
  .admin-table td.drag-grip { width: 34px; padding-right: 0; color: var(--ink-faint); cursor: grab; }
  .admin-table td.drag-grip:active { cursor: grabbing; }
  .admin-table tbody tr:hover td.drag-grip { color: var(--ink-mute); }
  .admin-table td.drag-grip i[data-lucide] { width: 16px; height: 16px; display: block; }
  .admin-table tr.row-dragging { opacity: .45; background: var(--main-tint); }
  /* 고치는 중인 행 — 입력칸이 칸 안에 그대로 들어간다 */
  .admin-table tr.row-editing { background: var(--sub-soft); }
  .admin-table .crow-in { width: 100%; min-width: 90px; padding: 7px 9px; font: inherit; font-size: 13.5px;
    border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); }
  .admin-table .crow-in:focus { outline: none; border-color: var(--main); }
  .admin-table .dt { color: var(--ink-mute); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .admin-empty { padding: 48px 24px; text-align: center; color: var(--ink-mute); }
  .admin-empty i[data-lucide]{ width: 34px; height: 34px; opacity: .4; margin-bottom: 10px; }

  .st-sel { font: inherit; font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  .st-신규, .st-신규 { color: var(--point); }
  .icon-btn { background: transparent; border: 1px solid var(--line); border-radius: 8px; width: 32px; height: 32px; display: inline-grid; place-items: center; cursor: pointer; color: var(--ink-mute); }
  .icon-btn:hover { border-color: var(--danger); color: var(--danger); background: #fff; }
  .icon-btn i[data-lucide]{ width: 15px; height: 15px; }

  .admin-form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 22px var(--gutter-panel); }
  .admin-form .full { grid-column: 1 / -1; }
  .toggle { position: relative; width: 44px; height: 25px; border-radius: 999px; background: var(--line); border: none; cursor: pointer; transition: background var(--dur-fast); flex-shrink: 0; }
  .toggle.on { background: var(--main); }
  .toggle i { position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: #fff; transition: transform var(--dur-fast); box-shadow: var(--sh-xs); }
  .toggle.on i { transform: translateX(19px); }

  .card-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 22px var(--gutter-panel); }
  .pcard { border: 1px solid var(--line-soft); border-radius: var(--r-md); padding: 16px; background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
  .pcard .pc-logo { height: 60px; display: grid; place-items: center; background: var(--main-tint); color: var(--main-deep); border-radius: 8px; font-family: var(--font-head); font-weight: 800; overflow: hidden; }
  .pcard .pc-logo img { max-height: 56px; max-width: 90%; object-fit: contain; }
  .pcard .pc-name { font-weight: 700; font-size: 14px; }
  .pcard .pc-sub { font-size: 12px; color: var(--ink-mute); }
  .pcard .pc-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }

  /* 페이지 이미지 — 2단: 왼쪽 슬롯 목록·위치 조정 · 오른쪽 실제 페이지 미리보기 */
  .simg-split { display: grid; grid-template-columns: minmax(320px, 2fr) minmax(0, 3fr); gap: 20px; align-items: start; }
  .simg-preview { position: sticky; top: 86px; }
  .simg-frame-wrap { height: min(72vh, 860px); overflow: hidden; background: var(--bg); display: grid; place-items: start center; }
  .simg-frame-wrap.dev-mb { background: var(--surface-2); padding: 14px 0; place-items: start center; }
  .simg-frame-wrap iframe { display: block; border: 0; transform-origin: 0 0; }
  .simg-frame-wrap.dev-mb iframe { border-radius: 20px; box-shadow: var(--sh-lg); outline: 6px solid #1c1a16; outline-offset: 0; }
  @media (max-width: 1100px){ .simg-split { grid-template-columns: 1fr; } .simg-preview { position: static; } }

  /* 기기 토글 — PC/모바일 미리보기 폭 전환(위치 조정 대상 화면도 함께 바뀜) */
  .dev-toggle { display: inline-flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 12px; padding: 5px; }
  .dev-toggle button { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border: none; background: none; font: inherit; font-size: 13px; font-weight: 700; color: var(--ink-mute); cursor: pointer; border-radius: 9px; }
  .dev-toggle button.on { background: var(--main); color: #fff; box-shadow: var(--sh-sm); }
  .dev-toggle button i[data-lucide] { width: 15px; height: 15px; }

  /* 선택된 슬롯 셀 강조 + 위치 조정 가능한 칸은 클릭 가능 표시 */
  .pcard.sel { border-color: var(--point); box-shadow: 0 0 0 2px var(--point-tint); }
  /* 올린 사진이 아니라 '지금 그 자리에 보이는 기본 사진'임을 구분해 준다 */
  .pc-logo { position: relative; }
  .slot-default { position: absolute; left: 6px; top: 6px; background: rgba(28,26,22,.72); color: #fff;
    font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; letter-spacing: .01em; }
  .pcard.is-default .pc-logo.can-pos::after { content: "사진 올리면 위치 조정"; }
  .pc-logo[data-slot-sel] { cursor: pointer; position: relative; }
  .pcard.has-photo .pc-logo.can-pos::after { content: "위치 조정"; position: absolute; right: 6px; bottom: 6px; font-size: 10px; font-weight: 700; color: #fff; background: rgba(28,26,22,.66); padding: 2px 7px; border-radius: 6px; }

  /* 위치 편집기 — 올린 사진의 초점을 드래그/화살표로 맞춤 */
  .pos-editor { border: 1px solid var(--line-soft); border-radius: var(--r-md); background: var(--surface-2); padding: 16px; margin: 0 var(--gutter-panel) 6px; }
  .pe-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .pe-head b { font-size: 14px; }
  .pe-head .pe-dev { font-size: 12px; color: var(--main-deep); font-weight: 700; }
  .pe-stage { position: relative; width: 100%; max-width: 340px; margin: 0 auto; border-radius: var(--r-sm); overflow: hidden; background: #1c1a16; cursor: grab; touch-action: none; box-shadow: inset 0 0 0 1px var(--line); user-select: none; }
  .pe-stage.drag { cursor: grabbing; }
  .pe-img { position: absolute; inset: 0; background-size: cover; background-repeat: no-repeat; }
  .pe-stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
    background-size: 33.33% 33.33%; background-position: center; opacity: .35; }
  .pe-ctrls { display: grid; grid-template-columns: repeat(3, 36px); grid-template-rows: repeat(3, 36px); gap: 4px; justify-content: center; margin: 14px auto 6px; }
  .pe-ctrls button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
  .pe-ctrls button:hover { background: var(--surface-2); border-color: var(--main); }
  .pe-ctrls button i[data-lucide] { width: 16px; height: 16px; }
  .pe-ctrls .pe-up { grid-area: 1 / 2; } .pe-ctrls .pe-left { grid-area: 2 / 1; }
  .pe-ctrls .pe-center { grid-area: 2 / 2; } .pe-ctrls .pe-right { grid-area: 2 / 3; }
  .pe-ctrls .pe-down { grid-area: 3 / 2; }
  .pe-ctrls .pe-center { font-size: 11px; font-weight: 700; color: var(--ink-mute); }
  .pe-hint { font-size: 12px; color: var(--ink-mute); line-height: 1.6; text-align: center; margin: 4px 0 0; }
  .pe-nocrop { font-size: 13px; color: var(--ink-mute); text-align: center; padding: 10px 6px; }

  .login-gate { position: fixed; inset: 0; z-index: 2000; background: var(--main-deeper); display: grid; place-items: center; background-image: var(--pat-light); background-size: var(--pat-size); }
  .login-card { background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--sh-lg); padding: 38px 36px; width: min(380px, 92vw); text-align: center; }
  .login-card img { width: 56px; height: 56px; mix-blend-mode: multiply; margin: 0 auto 14px; }
  .login-card h2 { font-size: 22px; }
  .login-card p { color: var(--ink-mute); font-size: 14px; margin: 8px 0 22px; }
  .login-card input { width: 100%; padding: 13px 15px; border: 1.5px solid var(--line); border-radius: var(--r-sm); font: inherit; font-size: 16px; text-align: center; }
  .login-card input:focus { outline: none; border-color: var(--main); box-shadow: 0 0 0 3px var(--main-tint); }
  .login-hint { font-size: 12px; color: var(--ink-faint); margin-top: 14px; }
  .login-err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }
  /* 좁은 화면 — 사이드바를 숨기되 반드시 불러올 수단을 둔다.
     예전에는 화면 밖으로만 밀어 두어 휴대폰에서 메뉴에 아예 닿을 수 없었다. */
  .as-toggle { display: none; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); cursor: pointer; place-items: center; color: var(--ink); flex-shrink: 0; }
  .as-toggle i[data-lucide] { width: 22px; height: 22px; }
  .as-dim { position: fixed; inset: 0; background: rgba(28,26,22,.45); z-index: 45;
    opacity: 0; pointer-events: none; transition: opacity var(--dur-fast) var(--ease); }
  .as-dim.on { opacity: 1; pointer-events: auto; }
  .admin-top .at-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .admin-top .at-left h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  @media (max-width: 760px){
    .admin-side { position: fixed; left: -260px; transition: left .2s; z-index: 50; }
    .admin-side.open { left: 0; box-shadow: var(--sh-lg); }
    .admin-view { padding: 20px 20px 150px; }
    .admin-top { padding: 0 16px; }
    .as-toggle { display: grid; }
    .at-manual { padding: 10px 12px; }
    .at-manual span { display: none; }
  }

  /* =========================================================
     시니어 친화(50–60대) 보강 — 글씨·버튼·터치영역 확대 + 또렷한 포커스
     아래 규칙은 위 기본 스타일을 덮어쓰는 '가독성 레이어'입니다.
     ========================================================= */
  .admin-top h1 { font-size: 24px; }
  .admin-top .at-meta { font-size: 14px; }
  .admin-nav button { font-size: 16px; padding: 13px 15px; }
  .admin-nav button i[data-lucide] { width: 20px; height: 20px; }
  .admin-nav .badge { font-size: 12.5px; padding: 2px 9px; }
  .as-foot a, .as-foot button { font-size: 14.5px; padding: 11px 12px; }
  .panel-head h3 { font-size: 18px; }
  .panel-head .ph-sub { font-size: 13.5px; }
  .admin-table { font-size: 15px; }
  .admin-table th { font-size: 12.5px; }
  .admin-table th, .admin-table td { padding: 14px 16px; }
  .admin-table .dt { font-size: 13px; }
  .pcard .pc-name { font-size: 15px; }
  .pcard .pc-sub { font-size: 13px; }
  .field label, .admin-form label { font-size: 15px; font-weight: 700; }
  .field input, .field select { font-size: 16px; min-height: 48px; }
  .field textarea { font-size: 16px; }
  .otabs button { font-size: 15.5px; padding: 13px 16px; }
  .otabs .cnt { font-size: 14px; }
  .subtabs button { font-size: 15px; padding: 12px 20px; }
  .obtn { font-size: 15px; padding: 11px 16px; min-height: 44px; }
  .odrop-menu button { font-size: 14.5px; padding: 11px 13px; }
  .st-sel { font-size: 14px; padding: 8px 13px; }
  .icon-btn { width: 40px; height: 40px; }
  .icon-btn i[data-lucide] { width: 18px; height: 18px; }
  .oguide summary { font-size: 15px; }
  .oguide-body ul { font-size: 14.5px; }
  .proc-info { font-size: 14.5px; }
  /* 입력·조작 중인 위치를 분명히 — 또렷한 포커스 표시(키보드·저시력 사용자) */
  .admin-view input:focus, .admin-view select:focus, .admin-view textarea:focus { outline: 3px solid var(--main-tint); outline-offset: 1px; }
  .admin-nav button:focus-visible, .obtn:focus-visible, .otabs button:focus-visible,
  .subtabs button:focus-visible, .icon-btn:focus-visible, .st-sel:focus-visible,
  .as-foot a:focus-visible, .as-foot button:focus-visible { outline: 3px solid var(--point); outline-offset: 2px; }

  /* =========================================================
     대시보드 — 화면 전체 폭 채우기 + 유입/상태 그래프
     ========================================================= */
  .admin-view.view-full { max-width: none; }
  /* 두 칸 중 한쪽이 짧으면 그 아래가 통째로 빈 배경으로 남는다(align-items:start 였을 때).
     늘려서 같은 높이로 맞추면 남는 공간이 패널 안으로 들어가 빈 구멍이 사라진다. */
  .dash-2col { display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; margin-top: 24px; align-items: stretch; }
  @media (max-width: 1100px){ .dash-2col { grid-template-columns: 1fr; } }
  .dash-2col > .panel { display: flex; flex-direction: column; }
  .dash-2col > .panel > *:last-child { flex: 1; }
  /* 표가 짧아 남는 자리도 배경으로 채워 패널이 끊겨 보이지 않게 한다 */
  .dash-2col > .panel > div[style*="overflow-x"] { display: flex; flex-direction: column; }
  .dash-2col > .panel .admin-table { flex: 0 0 auto; }
  .src-list { display: flex; flex-direction: column; gap: 18px; }
  .src-row { display: flex; flex-direction: column; gap: 8px; }
  .src-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14.5px; }
  .src-name { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink); }
  .src-name i[data-lucide] { width: 18px; height: 18px; color: var(--ink-mute); }
  .src-num { font-weight: 700; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .src-num em { color: var(--ink-mute); font-style: normal; font-weight: 600; margin-left: 5px; }
  .src-track { height: 13px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .src-fill { height: 100%; border-radius: 99px; min-width: 6px; transition: width .45s var(--ease); }

  /* 권한 그룹 카드 */
  .role-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .role-card { border: 1.5px solid var(--line-soft); border-radius: 14px; background: var(--surface); padding: 18px 20px;
    display: flex; flex-direction: column; gap: 10px; box-shadow: var(--sh-xs); }
  .rc-head { display: flex; align-items: center; gap: 8px; }
  .rc-head b { font-size: 16px; }
  .rc-n { margin-left: auto; font-size: 13px; color: var(--ink-mute); font-weight: 700; }
  .rc-desc { font-size: 13.5px; color: var(--ink-mute); margin: 0; line-height: 1.6; }
  .rc-perms { display: flex; flex-direction: column; gap: 6px; }
  .rc-chip { font-size: 12.5px; color: var(--ink-soft); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; line-height: 1.5; }
  .rc-chip b { color: var(--main-deep); margin-right: 5px; }
  .rc-foot { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line-soft); }

  /* 권한 체크 목록 */
  .perm-list { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
  .perm-group > b { display: block; font-size: 13px; color: var(--ink-mute); letter-spacing: .03em; margin-bottom: 6px; }
  .perm-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line-soft); cursor: pointer; margin-bottom: 6px; background: var(--surface); }
  .perm-row:hover { border-color: var(--main); }
  .perm-row.lock { opacity: .6; cursor: default; }
  .perm-row input { width: 18px; height: 18px; accent-color: var(--main); margin-top: 2px; flex-shrink: 0; }
  .perm-row span { display: flex; flex-direction: column; gap: 2px; }
  .perm-row span b { font-size: 14.5px; }
  .perm-row span span { font-size: 12.5px; color: var(--ink-mute); }
  .mem-form .field textarea { width: 100%; font: inherit; font-size: 15px; padding: 10px 13px;
    border: 1.5px solid var(--line); border-radius: 9px; resize: vertical; }

  .tel-link { color: var(--info); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tel-link:hover { text-decoration: underline; }
  /* 그룹 요약은 블록이 여럿이라 사이 간격을 한 곳에서 준다 */
  /* ---------- 세로 리듬 ----------
     화면 최상위 블록 사이 간격은 **컨테이너가** 정한다 — 공개 페이지에서 `.wrap` 이 하는 일과 같다.
     블록마다 인라인 margin 을 적어 오면서 값이 6·10·12·14·18·20·24 로 갈렸고,
     인라인은 미디어쿼리를 이겨 좁은 화면에서 조정할 수도 없었다
     (rules/spacing-rhythm.md 3·5절). 실제로 대시보드 맨 위 두 패널은 간격이 0이었다. */
  #adminView > * + * { margin-top: var(--gap-block); }
  #adminView .dash > * + * { margin-top: var(--gap-block); }

  /* 컨테이너 리듬에서 벗어나야 하는 자리 — 쓰는 값은 허용 5종뿐이다 */
  .gap-tight   { margin-top: var(--gap-tight); }
  .gap-related { margin-top: var(--gap-related); }
  .gap-block   { margin-top: var(--gap-block); }
  .mb-related  { margin-bottom: var(--gap-related); }
  .lbl-gap     { margin-bottom: var(--gap-tight); }   /* 라벨 → 그 아래 내용 */
  .ml-tight    { margin-left: var(--gap-tight); }
  .push        { margin-left: auto; }                 /* 줄 오른쪽으로 밀기 */
  .pull        { margin-right: auto; }
  /* 제목 바로 아래 붙는 보조 줄 — 두 줄이 한 항목으로 읽혀야 한다 */
  #adminView b + .pc-sub, .modal b + .pc-sub { margin-top: 4px; }
  /* 문단 꼬리 여백은 마지막 줄에서 지운다 — 상자 아래가 비어 보인다 */
  #adminView p:last-child, .modal p:last-child { margin-bottom: 0; }
  /* 폼 안에서 성격이 바뀌는 구역 */
  .form-sec { border-top: 1px solid var(--line-soft); padding-top: var(--gap-related); }
  .row-btns { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .opt-name { max-width: 280px; margin-bottom: var(--gap-tight); }
  .opt-row  { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sales-head, .simg-devbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .note-danger { border-color: var(--danger); background: var(--surface); }
  #adminView .gs-head + .stat-grid,
  #adminView .stat-grid + .gs-grid,
  #adminView .gs-grid + .dash-2col,
  #adminView .dash-2col + .dash-2col { margin-top: var(--gap-block); }
  /* 패널 안에 놓인 안내문은 패널 제목과 같은 선에서 시작한다 */
  .panel > .modal-note { margin-inline: var(--gutter-panel); }

  /* 판매 현황 — 주간·월간 카드 + 일별 막대 */
  .sale-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 18px var(--gutter-panel) 4px; }
  @media (max-width: 900px){ .sale-grid { grid-template-columns: 1fr; } }
  .sale-card { border: 1.5px solid var(--line-soft); border-radius: 14px; background: var(--surface-2); padding: 18px 20px; }
  .sale-card .sc-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .sale-card .sc-top b { font-size: 15.5px; }
  .sale-card .sc-range { font-size: 12.5px; color: var(--ink-mute); font-variant-numeric: tabular-nums; }
  .sale-card .sc-amt { font-family: var(--font-head); font-weight: 800; font-size: 32px; line-height: 1.1;
    margin-top: 10px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .sale-card .sc-amt em { font-style: normal; font-size: 17px; font-weight: 700; margin-left: 3px; color: var(--ink-mute); }
  .sale-card .sc-sub { font-size: 13.5px; color: var(--ink-mute); margin-top: 6px; }
  /* 증감은 색만으로 구분하지 않는다 — ▲▼ 기호를 함께 둬 색을 못 보는 경우에도 읽힌다 */
  .sale-card .sc-delta { font-size: 14px; font-weight: 700; margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--line-soft); }
  .sale-card .sc-delta span { font-weight: 500; color: var(--ink-mute); font-size: 12.5px; }
  .sale-card .sc-delta.up   { color: var(--ok); }
  .sale-card .sc-delta.down { color: var(--danger); }
  .sale-card .sc-delta.flat { color: var(--ink-mute); }
  .vc-bar.zero { background: var(--line); }
  .vc-day em { display: block; font-style: normal; font-size: 10px; color: var(--ink-faint); margin-top: 1px; }

  /* 오늘 해야 할 일 — 실무 처리 대기 카드 */
  .todo-panel .panel-head { border-bottom: none; padding-bottom: 0; }
  .todo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; padding: 16px var(--gutter-panel) var(--gutter-panel); }
  @media (max-width: 1100px){ .todo-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 700px){ .todo-grid { grid-template-columns: repeat(2, 1fr); } }
  .todo { text-align: left; border: 1.5px solid var(--line-soft); background: var(--surface-2); border-radius: 14px; padding: 16px 16px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 7px; font: inherit; transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
  .todo:hover { transform: translateY(-2px); box-shadow: var(--sh-sm); }
  .todo:focus-visible { outline: 3px solid var(--point); outline-offset: 2px; }
  .todo.on { border-color: var(--point); background: var(--point-tint); }
  .todo-i { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: #fff; color: var(--ink-mute); }
  .todo.on .todo-i { background: var(--point); color: #fff; }
  .todo-i i[data-lucide] { width: 21px; height: 21px; }
  .todo-n { font-family: var(--font-head); font-weight: 800; font-size: 30px; line-height: 1; color: var(--ink-faint); }
  .todo.on .todo-n { color: var(--point-deep); }
  .todo-n em { font-style: normal; font-size: 15px; font-weight: 700; margin-left: 3px; color: var(--ink-mute); }
  .todo-l { font-size: 15.5px; font-weight: 700; color: var(--ink); }
  .todo-go { font-size: 13px; font-weight: 700; color: var(--point); display: inline-flex; align-items: center; gap: 4px; }
  .todo-go i[data-lucide] { width: 14px; height: 14px; }
  .todo-go.done { color: var(--ink-faint); }

  /* 목록 도구(검색 + CSV) — 패널 헤더 우측 */
  .panel-tools { display: flex; gap: 10px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .list-search { padding: 9px 13px; border: 1.5px solid var(--line); border-radius: 9px; font: inherit; font-size: 14px; background: var(--surface); width: 230px; max-width: 46vw; }
  .list-search:focus { outline: none; border-color: var(--main); }
  .cell-clip { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hd-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--olive); margin-right: 6px; vertical-align: middle; }

  /* 설정 폼 — 섹션 구분 */
  .set-form textarea { font: inherit; font-size: 15px; line-height: 1.6; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; resize: vertical; min-height: 64px; }
  .set-form textarea:focus { outline: none; border-color: var(--main); }
  .set-map { height: 320px; border-radius: 11px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
  .set-map-tools { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .leaflet-container { font: inherit; }
  .set-form .set-sec { grid-column: 1/-1; display: flex; align-items: center; gap: 8px; margin: 12px 0 0; padding-top: 16px; border-top: 1px solid var(--line-soft); font-size: 14.5px; }
  .set-form .set-sec:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  .set-form .set-sec i[data-lucide] { width: 18px; height: 18px; color: var(--main); }
  .set-form .set-sec b { font-weight: 800; }

  /* 표 쪽 이동 */
  .pager-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; padding: 14px var(--gutter-panel); border-top: 1px solid var(--line-soft);
    background: var(--surface-2); }
  .pg-info { font-size: 13px; color: var(--ink-mute); font-variant-numeric: tabular-nums; }
  .pg-nav { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-left: auto; }
  .pg-b { font: inherit; font-size: 13.5px; font-weight: 700; min-width: 38px; min-height: 38px;
    padding: 0 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink-soft); cursor: pointer; }
  .pg-b:hover:not(:disabled):not(.on) { border-color: var(--main); color: var(--main-deep); }
  .pg-b.on { background: var(--main); border-color: var(--main); color: #fff; }
  .pg-b:disabled { opacity: .4; cursor: default; }
  .pg-gap { color: var(--ink-faint); padding: 0 2px; }

  /* 지난 자료 안내 — 최근 1년만 올려 두고 그 이전은 부를 때 가져온다 */
  .older-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 14px var(--gutter-panel); border-top: 1px solid var(--line-soft);
    background: var(--point-tint); font-size: 14px; color: var(--ink-soft); }
  .older-bar i[data-lucide] { width: 18px; height: 18px; color: var(--point-ink); flex: none; }
  .older-bar .btn { margin-left: auto; }
  .older-bar.quiet { background: var(--surface-2); color: var(--ink-mute); font-size: 13px; }
  .older-bar.quiet i[data-lucide] { color: var(--ink-faint); }
  @media (max-width: 520px) { .older-bar .btn { margin-left: 0; width: 100%; justify-content: center; } }
  @media (max-width: 520px) {
    .pager-bar { justify-content: center; }
    .pg-nav { margin-left: 0; }
    .pg-info { width: 100%; text-align: center; }
  }

  /* 검색 노출 — 공유 그림 미리보기 */
  .seo-prev { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2);
    padding: 10px; display: grid; place-items: center; min-height: 96px; overflow: hidden; }
  .seo-prev img { max-width: 100%; max-height: 160px; border-radius: var(--r-sm); display: block; }
  .seo-prev .seo-bad { display: none; font-size: 13px; color: var(--danger); font-weight: 700; }
  .seo-prev.bad img { display: none; }
  .seo-prev.bad .seo-bad { display: block; }
  .seo-prev.bad { border-color: var(--danger); }
  /* 주소·코드 — 좁은 화면에서 상자 밖으로 나가지 않게 반드시 끊어 준다.
     .ui(버튼·메뉴 이름 배지)는 nowrap 이라 주소를 넣으면 넘친다 — 주소는 여기에 넣는다.
     word-break 는 건드리지 않는다(글자 단위로 꺾여 한글 어절이 깨진다) —
     overflow-wrap 만으로 '한 줄에 안 들어갈 때만' 끊는다. */
  #adminView code { background: var(--surface-2); border: 1px solid var(--line-soft);
    border-radius: var(--r-xs); padding: 2px 6px; font-size: 13px;
    overflow-wrap: anywhere; }

  /* ============================================================
     사용 설명서 (assets/manual.html 을 읽어 표시)
     ============================================================ */
  /* 매뉴얼 전용 — 시니어 친화(50–60대): 본문 글자를 한 단계 키우고 줄간격을 넓힌다 */
  .man-body { font-size: 17px; line-height: 1.85; }
  .man-body .lede { font-size: 19px; }

  /* 번호 단계 — '1번 하고 2번 하세요'가 눈으로 바로 읽히도록 */
  .mstep { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--s5); counter-reset: ms; }
  .mstep > li { display: grid; grid-template-columns: 40px 1fr; gap: var(--s4); align-items: start; counter-increment: ms; }
  /* 번호는 1열 1행, 내용은 전부 2열. 자동 배치에 맡기면 자식이 셋 이상일 때
     세 번째가 40px 짜리 번호 칸(1열)으로 내려가 글자가 한 자씩 끊긴다. */
  .mstep > li::before {
    content: counter(ms); grid-column: 1; grid-row: 1;
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--point); color: var(--point-ink);
    font-family: var(--font-head); font-weight: 800; font-size: 17px;
  }
  .mstep > li > * { grid-column: 2; min-width: 0; }
  .mstep > li > b { display: block; font-size: 17px; }
  .mstep > li > p { margin: 4px 0 0; color: var(--ink-soft); font-size: 15.5px; line-height: 1.75; }
  .mstep > li > p + p { margin-top: 6px; }

  /* 안내 상자 — 도움말 / 주의 / 경고 3단계 */
  .mnote { display: grid; grid-template-columns: 26px 1fr; gap: var(--s4); align-items: start;
    padding: 16px 20px; border-radius: var(--r-md); font-size: 15.5px; line-height: 1.75;
    border: 1px solid var(--line-soft); background: var(--surface-2); color: var(--ink-soft); }
  .mnote i[data-lucide] { width: 22px; height: 22px; color: var(--main); margin-top: 1px; }
  .mnote b { color: var(--ink); }
  .mnote.warn { background: var(--point-tint); border-color: var(--point); }
  .mnote.warn i[data-lucide] { color: var(--point-ink); }
  .mnote.danger { background: var(--surface); border-color: var(--danger); }
  .mnote.danger i[data-lucide] { color: var(--danger); }
  /* .wrap 세로 리듬(44px)보다 좁게 — 안내 상자끼리는 한 덩어리로 읽힌다 */
  .man-body .mnote + .mnote { margin-top: var(--s3); }

  /* 가운데 정렬 카드 — 문장이 한 줄로 길어지지 않도록 폭을 묶는다 */
  .man-center { text-align: center; }
  .man-center > .icon-badge { margin-inline: auto; }
  .man-narrow { max-width: 34em; margin-inline: auto; }

  /* 관리자 화면의 버튼·메뉴 이름을 본문에서 가리킬 때 */
  .ui { display: inline-block; padding: 2px 9px; border-radius: var(--r-xs);
    background: var(--main-tint); color: var(--main-deep); font-weight: 700; font-size: 0.94em; white-space: nowrap; }
  .ui.point { background: var(--point); color: var(--point-ink); }

  /* 목차 카드 — 매뉴얼 첫 화면의 빠른 이동 */
  .toc { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s4); }
  @media (max-width: 900px){ .toc { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px){ .toc { grid-template-columns: 1fr; } }
  .toc a { display: flex; gap: var(--s4); align-items: center; padding: 18px 20px;
    border: 1px solid var(--line-soft); border-radius: var(--r-md); background: var(--surface);
    box-shadow: var(--sh-xs); transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
  .toc a:hover { transform: translateY(-2px); box-shadow: var(--sh-md); }
  .toc b { display: block; font-size: 16px; color: var(--ink); }
  /* `.toc span` 으로 뭉뚱그리면 아이콘 상자(.icon-badge 도 span 이다)의 가운데 정렬까지
     덮어써 아이콘이 상자 좌상단에 붙는다. 글자 span 만 집는다. */
  .toc a > span:not(.icon-badge) { flex: 1; min-width: 0; }
  .toc a > span > span { display: block; font-size: 14px; color: var(--ink-mute); margin-top: 2px; }

  /* 주문 상태 흐름 — 표 대신 한 줄 흐름으로 */
  .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .flow .fs { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: var(--r-pill);
    font-size: 15px; font-weight: 700; background: var(--surface); border: 1.5px solid var(--line); color: var(--ink-soft); }
  .flow .fs.on { background: var(--main); border-color: var(--main); color: #fff; }
  .flow i[data-lucide] { width: 16px; height: 16px; color: var(--ink-faint); }

  /* .il b 는 항목 제목용 '블록' 스타일이라, 설명문 안에서 낱말을 강조하면
     혼자 줄바꿈되고 커진다 → 설명문 안의 강조만 인라인으로 되돌린다. */
  .man-body .il p b { display: inline; font-size: inherit; line-height: inherit; }

  /* 매뉴얼 표 — 글자 크기를 본문에 맞춰 키움 */
  .man-body .table { font-size: 15.5px; }
  .man-body .table th, .man-body .table td { padding: 15px 16px; vertical-align: top; }
  .man-body .table td b { color: var(--ink); }

  /* 체크리스트 */
  .mcheck { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  .mcheck li { display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; font-size: 16px; line-height: 1.7; }
  .mcheck li i[data-lucide] { width: 22px; height: 22px; color: var(--olive); margin-top: 2px; }
  .mcheck li.todo i[data-lucide] { color: var(--point-deep); }
  .mcheck li span { color: var(--ink-soft); font-size: 14.5px; display: block; margin-top: 2px; }


  /* 인쇄 — 종이로 뽑아 옆에 두고 보실 수 있게 */
  @media print {
    #site-nav, #site-footer, .jump, .to-top, .read-bar, .man-print-hide, .man-gate { display: none !important; }
    .page-hero { padding: 24px 0 !important; }
    .section { padding: 20px 0 !important; page-break-inside: avoid; }
    .reveal { opacity: 1 !important; transform: none !important; }
    body { background: #fff; }
  }
  /* 관리자 콘솔에는 스크롤 등장 관찰자(revealScan)가 돌지 않는다 —
     .reveal 이 opacity:0 인 채로 남아 화면이 통째로 비어 보인다.
     관리 화면에서 등장 애니메이션은 필요도 없으므로 바로 보이게 못박는다. */
  .admin-view .man-body .reveal,
  html.js .admin-view .man-body .reveal:not(.in) { opacity: 1 !important; transform: none !important; animation: none !important; }

  /* ---- 관리자 콘솔 안에 넣을 때 ----
     설명서는 원래 독립 페이지용이라 섹션 여백이 크다. 관리자 화면 안에서는
     좌우 여백을 .admin-view 가 이미 만들고 있어 그대로 두면 두 배로 벌어진다. */
  .admin-view .man-body .section { padding-block: var(--s10); }
  /* 좌우 여백을 **절이** 만든다.
     전에는 `.admin-view` 의 32px 만 믿고 절 안쪽을 0 으로 뒀는데, 색 밴드(band-oat 등)는
     '보이는 상자'라 그 안에서 글이 모서리에 그대로 붙었다 — 13개 절 중 7개가 좌0 우0 이었다.
     투명한 절에도 같은 값을 줘야 스크롤할 때 글의 왼쪽 끝이 절마다 흔들리지 않는다.
     바깥(.view-manual)을 0 으로 돌려 총합은 그대로 둔다. */
  .admin-view.view-manual { padding-inline: 0; }
  .admin-view .man-body .wrap { padding-inline: var(--gutter); max-width: none; }
  .admin-view .man-body .man-tabs .mt-row { padding-inline: var(--gutter); }
  .admin-view .man-body .page-hero { display: none; }   /* 제목은 상단바가 말한다 */
  .admin-view .man-body .jump { position: sticky; top: 0; z-index: 5; margin-bottom: var(--s4); }
  /* 절로 뛸 때 상단바와 탭 바 둘 다 비켜야 제목이 보인다 — 60px 이면 탭 아래로 숨었다 */
  .admin-view .man-body section[id] { scroll-margin-top: calc(var(--admin-top-h) + 56px); }
  /* 색 밴드가 관리자 패널 폭을 넘지 않게 안쪽으로 넣는다 */
  .admin-view .man-body .section[class*="band-"] { border-radius: var(--r-lg); }

  /* 인쇄 — 설명서 화면에서 인쇄하면 설명서만 나온다 */
  @media print {
    .admin-side, .admin-top, .man-print-hide, .jump, .to-top { display: none !important; }
    .admin-main, .admin-view { padding: 0 !important; max-width: none !important; }
    .man-body .section { padding-block: 16px !important; page-break-inside: avoid; }
    .man-body .reveal { opacity: 1 !important; transform: none !important; }
    body { background: #fff; }
  }

  /* 신청·문의 상세 모달 */
  .rec-detail .dl { margin-bottom: 6px; }
  .rec-detail .dl-row { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
  .rec-detail .dl-k { width: 84px; flex-shrink: 0; color: var(--ink-mute); font-size: 13px; }
  .rec-detail .dl-v { font-weight: 600; font-size: 14.5px; }
  .rec-detail .field { margin-top: 14px; }
  .rec-detail .field label { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 7px; color: var(--ink); }
  .rec-detail .rec-cust { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 9px; padding: 12px 14px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; }
  .rec-detail .rec-status { width: 100%; min-height: 46px; border-radius: 9px; }
  .rec-detail .rec-memo { width: 100%; font: inherit; font-size: 14.5px; line-height: 1.6; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 9px; resize: vertical; }
  .rec-detail .rec-memo:focus, .rec-detail .rec-status:focus { outline: none; border-color: var(--main); }
  .rec-detail .modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
</style>
</head>
<body data-page="admin">

<div class="login-gate" id="loginGate" style="display:none">
  <div class="login-card">
    <img src="assets/logo.png" alt="로고">
    <h2>관리자 로그인</h2>
    <p>한국참전통발효식품협동조합 관리자 페이지</p>
    <form id="loginForm">
      <input type="text" id="loginId" placeholder="아이디" autocomplete="username" style="margin-bottom:10px">
      <input type="password" id="loginPw" placeholder="비밀번호" autocomplete="current-password">
      <div class="login-err" id="loginErr"></div>
      <button class="btn btn-point btn-lg" type="submit" style="width:100%;margin-top:6px">로그인</button>
    </form>
  </div>
</div>

<div class="admin" id="adminApp" style="display:none">
  <div class="as-dim" id="asDim"></div>
  <aside class="admin-side" id="adminSide">
    <div class="as-brand">
      <img src="assets/logo.png" alt="로고">
      <div><b>한국참전통발효식품</b><br><span>ADMIN CONSOLE</span></div>
    </div>
    <nav class="admin-nav" id="adminNav"></nav>
    <div class="as-foot">
      <button data-act="myPassword" id="myPwBtn"><i data-lucide="key-round"></i>비밀번호 변경</button>
      <a href="index.html"><i data-lucide="external-link"></i>홈페이지 보기</a>
      <button id="logoutBtn"><i data-lucide="log-out"></i>로그아웃</button>
    </div>
  </aside>
  <main class="admin-main">
    <div class="admin-top">
      <div class="at-left">
        <button class="as-toggle" id="asToggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="adminSide">
          <i data-lucide="menu"></i>
        </button>
        <h1 id="adminTitle">대시보드</h1>
      </div>
      <div class="at-right">
        <span class="at-meta" id="adminMeta">관리자님 환영합니다</span>
        <button class="at-manual" data-nav="manual" title="사용 설명서 보기">
          <i data-lucide="book-open-check"></i><span>사용 설명서</span>
        </button>
      </div>
    </div>
    <div class="admin-view" id="adminView"></div>
  </main>
</div>

<!-- 도움말 챗봇 — 설명서 내용에 근거해 답한다 -->
<button class="cb-fab" id="cbFab" aria-label="도움말 열기" title="궁금한 것을 물어보세요">
  <i data-lucide="message-circle-question"></i>
</button>
<section class="cb-panel" id="cbPanel" role="dialog" aria-label="도움말">
  <div class="cb-head">
    <i data-lucide="sparkles"></i>
    <div><b>무엇이든 물어보세요</b><span class="cb-sub">사용 설명서를 찾아 답합니다</span></div>
    <button id="cbClose" aria-label="닫기"><i data-lucide="x"></i></button>
  </div>
  <div class="cb-body" id="cbBody"></div>
  <div class="cb-quick" id="cbQuick"></div>
  <form class="cb-foot" id="cbForm">
    <input id="cbInput" placeholder="예) 입금 확인은 어떻게 하나요?" autocomplete="off">
    <button type="submit" id="cbSend" aria-label="보내기"><i data-lucide="send-horizontal"></i></button>
  </form>
</section>

<!-- 크게 보기 — 좁은 채팅 칸에 담기지 않는 설명서 절을 전체 화면으로 펼치고 글자를 키운다 -->
<div class="cb-zoom" id="cbZoom" role="dialog" aria-modal="true" aria-label="설명서 크게 보기">
  <div class="cb-zoom-card">
    <div class="cb-zoom-bar">
      <b id="cbZoomTitle"></b>
      <div class="cb-zoom-tools">
        <button id="cbZoomOut" aria-label="글자 작게" title="글자 작게"><i data-lucide="zoom-out"></i></button>
        <span id="cbZoomPct">100%</span>
        <button id="cbZoomIn" aria-label="글자 크게" title="글자 크게"><i data-lucide="zoom-in"></i></button>
        <button id="cbZoomGo" data-cbgo=""><i data-lucide="book-open"></i>설명서에서 열기</button>
        <button id="cbZoomClose" aria-label="닫기"><i data-lucide="x"></i></button>
      </div>
    </div>
    <div class="cb-zoom-body man-body man-embed" id="cbZoomBody"></div>
  </div>
</div>

<!-- 사진 원본 보기 -->
<div class="cb-img" id="cbImg" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <img alt="">
  <p>아무 곳이나 누르면 닫힙니다</p>
</div>
