<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="한국참전통발효식품협동조합">
  <!-- 로고(assets/logo.png)의 옹기를 실루엣만 남겨 단순화한 마크.
       붓질과 '참' 글자는 16px 에서 뭉개져 형태가 사라지므로 뺐다.
       색은 로고 원본에서 뽑은 값이다 — 먹 #0C0C0A · 주황 #E36E10 · 종이 #FAF9F4.
       뚜껑은 몸통에 '얹어' 그린다. 띄우면 항아리가 아니라 점 찍힌 덩어리로 읽힌다. -->
  <rect width="64" height="64" rx="14" fill="#FAF9F4"/>
  <!-- 몸통 — 어깨가 가장 넓고 바닥으로 좁아지는 옹기 옆선 -->
  <path d="M25.5 25C16 29.5 9.5 36 9.5 42.5C9.5 50.5 16.5 56.5 24.5 56.5L39.5 56.5C47.5 56.5 54.5 50.5 54.5 42.5C54.5 36 48 29.5 38.5 25Z" fill="#0C0C0A"/>
  <!-- 뚜껑 — 목보다 넓어야 뚜껑으로 읽힌다 -->
  <path d="M20 25C20 16.5 44 16.5 44 25Z" fill="#E36E10"/>
</svg>
