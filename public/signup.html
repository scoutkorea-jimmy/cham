<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 · 한국참전통발효식품협동조합</title>
<meta name="description" content="회원으로 가입하시면 주문 내역을 한곳에서 보고, 주문할 때 정보를 다시 적지 않아도 됩니다.">
<meta name="robots" content="noindex,follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="한국참전통발효식품협동조합">
<meta property="og:title" content="회원가입 · 한국참전통발효식품협동조합">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/site.css">
<style id="page-style">
  .auth-wrap { max-width: 640px; margin: 0 auto; }
  .form-msg { margin: 0; padding: 11px 14px; border-radius: var(--r-md); font-size: var(--fs-sm); line-height: var(--lh-normal); }
  .form-msg.bad  { background: var(--danger-tint, #FBEAE8); color: var(--danger); }
  .form-msg.good { background: var(--main-tint); color: var(--main-deep); }
  /* 필수·선택을 카드로 나눈다 — 제목 한 줄이 칸마다 붙는 배지를 대신한다 */
  .auth-wrap .card + .card { margin-top: var(--gap-related); }
  .group-head { margin: 0 0 var(--s5); padding-bottom: 14px; border-bottom: 1px solid var(--line-soft); }
  .group-head h3 { margin: 0; font-size: var(--fs-h4); }
  .group-head p { margin: 6px 0 0; font-size: var(--fs-sm); color: var(--ink-mute); line-height: var(--lh-normal); }
  /* 동의 줄 — 글자를 눌러도 체크되도록 label 로 감싼다 */
  .agree { display: flex; gap: 10px; align-items: flex-start; font-size: var(--fs-sm); color: var(--ink-soft); line-height: var(--lh-normal); }
  .agree input { width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; accent-color: var(--main); }
  .agree a { text-decoration: underline; }
</style>
</head>
<body data-page="signup">
<header id="site-nav"></header>

<section class="section">
  <div class="wrap auth-wrap">
    <div class="section-head reveal">
      <span class="eyebrow">회원</span>
      <h2>회원가입</h2>
      <p class="lede">가입하시면 주문 내역을 한곳에서 보실 수 있고, 주문하실 때마다 이름·연락처·주소를 다시 적지 않아도 됩니다.</p>
    </div>

    <form id="signupForm" novalidate>
      <!-- 필수·선택을 칸마다 배지로 적지 않는다. 아홉 번 반복되면 표시가 시끄러워
           오히려 눈에 안 들어온다. 카드로 묶으면 제목 한 줄이 그 일을 대신한다. -->
      <div class="card card-pad reveal">
        <div class="group-head">
          <h3>필수 정보</h3>
          <p>모두 적어 주셔야 가입됩니다.</p>
        </div>
        <div class="form-grid">
          <div class="field full">
            <label for="su-id">아이디</label>
            <input id="su-id" name="username" required autocomplete="username" placeholder="영문 소문자·숫자 4~32자 (이메일도 됩니다)">
            <span class="hint">로그인할 때 쓰실 아이디입니다. 가입 후에는 바꿀 수 없습니다.</span>
          </div>
          <div class="field">
            <label for="su-pw">비밀번호</label>
            <input id="su-pw" name="password" type="password" required autocomplete="new-password" placeholder="10자 이상">
            <span class="hint">10자 이상, 영문·숫자·기호 중 두 가지 이상</span>
          </div>
          <div class="field">
            <label for="su-pw2">비밀번호 확인</label>
            <input id="su-pw2" name="password2" type="password" required autocomplete="new-password">
          </div>
          <div class="field">
            <label for="su-name">이름</label>
            <input id="su-name" name="name" required autocomplete="name" placeholder="홍길동">
          </div>
          <div class="field">
            <label for="su-phone">휴대전화</label>
            <input id="su-phone" name="phone" type="tel" required autocomplete="tel" placeholder="010-0000-0000">
          </div>
        </div>
      </div>

      <div class="card card-pad reveal">
        <div class="group-head">
          <h3>선택 정보</h3>
          <p>비워 두셔도 가입됩니다. 나중에 마이페이지에서 채우실 수 있습니다.</p>
        </div>
        <div class="form-grid">
          <div class="field full">
            <label for="su-email">이메일</label>
            <input id="su-email" name="email" type="email" autocomplete="email" placeholder="주문 확인 안내를 받으실 수 있습니다">
          </div>
          <div class="field">
            <label for="su-post">우편번호</label>
            <div class="field-row">
              <input id="su-post" name="postcode" autocomplete="postal-code">
              <button type="button" class="btn btn-ghost"
                data-postcode-zip="#su-post" data-postcode-addr="#su-addr" data-postcode-detail="#su-addr2">
                <i data-lucide="search"></i>주소 찾기</button>
            </div>
          </div>
          <div class="field full">
            <label for="su-addr">주소</label>
            <input id="su-addr" name="address" autocomplete="street-address" placeholder="주소 찾기로 채워집니다">
          </div>
          <div class="field full">
            <label for="su-addr2">상세주소</label>
            <input id="su-addr2" name="addressDetail" placeholder="주문하실 때 배송지로 미리 채워집니다">
          </div>
        </div>
      </div>

      <!-- 동의는 한 묶음 안에 필수와 선택이 섞여 있어 카드로 나눌 수 없다.
           여기서만 줄마다 적는다. -->
      <div class="card card-pad reveal">
        <div class="group-head">
          <h3>약관 동의</h3>
        </div>
        <div class="form-grid">
          <div class="field full" style="gap:12px">
            <label class="agree"><input type="checkbox" name="agreeTerms" value="1"><span><b class="tag-req">필수</b> <a href="terms.html" target="_blank">이용약관</a>에 동의합니다.</span></label>
            <label class="agree"><input type="checkbox" name="agreePrivacy" value="1"><span><b class="tag-req">필수</b> <a href="privacy.html" target="_blank">개인정보 수집·이용</a>에 동의합니다.</span></label>
            <label class="agree"><input type="checkbox" name="marketingOptin" value="1"><span><b class="tag-opt">선택</b> 교육 일정·신제품 소식을 받아보겠습니다.</span></label>
          </div>

          <div class="field full">
            <p id="signupMsg" class="form-msg" hidden></p>
          </div>
          <div class="field full">
            <button class="btn btn-point btn-lg" type="submit" style="width:100%">가입하기</button>
          </div>
        </div>
        <p class="muted" style="margin:var(--gap-related) 0 0;font-size:var(--fs-sm);text-align:center">
          이미 회원이신가요? <a href="mypage.html" style="text-decoration:underline">로그인</a>
        </p>
      </div>
    </form>

    <p class="muted reveal" style="font-size:var(--fs-caption);margin-top:var(--gap-related)">
      ※ 회원가입 없이도 <a href="products.html" style="text-decoration:underline">비회원으로 주문</a>하실 수 있습니다.
      비회원 주문은 주문번호로 조회합니다.
    </p>
  </div>
</section>

<footer id="site-footer"></footer>
<script defer src="https://unpkg.com/lucide@1.17.0"></script>
<script defer src="assets/site.js"></script>
<script defer src="assets/member.js"></script>
</body>
</html>
