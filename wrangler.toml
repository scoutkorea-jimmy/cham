# cham · Cloudflare Pages 설정
# 로컬 개발:  npx wrangler pages dev   → http://localhost:8788
# 운영 바인딩(D1 · R2 · 시크릿)은 Cloudflare Pages 대시보드에서도 설정해야 한다.

name = "cham"
compatibility_date = "2026-07-26"

# 배포 대상 = public/ 안에 있는 것뿐이다.
#
# 예전에는 저장소 루트였다. 그래서 저장소에 있는 **모든 파일이 주소를 가졌고**,
# docs/handoff.md · wrangler.toml · db/*.sql 이 실제로 공개돼 있었다.
# 미들웨어로 404 를 돌려주는 덮개를 씌웠지만 그건 새 파일이 늘 때마다 패턴을
# 챙겨야 하는 방식이다 — 여기서는 애초에 주소가 생기지 않는다.
#
# functions/ 는 루트에 그대로 둔다(Pages 가 프로젝트 루트에서 찾는다).
# 로컬로 화면을 볼 때는 public/ 안에서 서버를 띄운다:
#   (cd public && python3 -m http.server 8777 --bind 127.0.0.1)
pages_build_output_dir = "public"

# ── D1 (주문 · 신청 · 문의 · 상품 · 계정) ──────────────────────
# 최초 1회:  npx wrangler d1 create cham-db
# 출력된 database_id 를 아래에 넣는다.
[[d1_databases]]
binding = "DB"
database_name = "cham-db"
database_id = "34892062-1509-430c-baf8-9269aa859ca6"

# ── R2 (상품 · 페이지 · 게시글 첨부 이미지) ────────────────────
# 최초 1회:  npx wrangler r2 bucket create cham-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cham-media"

# ── Workers AI (관리자 도움말 챗봇) ───────────────────────────
# 설명서에서 찾은 대목을 근거로 답을 다듬는 데만 쓴다.
# 모델이 없거나 한도를 넘으면 화면이 찾은 절을 그대로 보여 주므로, 없어도 동작한다.
[ai]
binding = "AI"
